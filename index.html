<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nguyenphuchntt.github.io</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background-color: #ffffff;
    color: #1a1a1a;
    line-height: 1.6;
  }

  header {
    background-color: #1a1a1a;
    color: #ffffff;
    padding: 60px 20px;
    text-align: center;
    border-bottom: 3px solid #000000;
  }

  header h1 {
    font-size: 2.2em;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  header p {
    font-size: 1.1em;
    color: #cccccc;
  }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  section {
    margin-bottom: 40px;
    border: 1px solid #dddddd;
    padding: 24px;
  }

  section h2 {
    font-size: 1.3em;
    margin-bottom: 12px;
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 8px;
    display: inline-block;
  }

  section p {
    margin-top: 8px;
  }

  ul {
    list-style: none;
    margin-top: 10px;
  }

  ul li {
    padding: 6px 0;
    border-bottom: 1px solid #eeeeee;
  }

  ul li:last-child {
    border-bottom: none;
  }

  .contact-list a {
    color: #1a1a1a;
    text-decoration: none;
    border-bottom: 1px solid #1a1a1a;
  }

  .contact-list a:hover {
    background-color: #1a1a1a;
    color: #ffffff;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.9em;
    color: #777777;
    border-top: 1px solid #dddddd;
  }
</style>
</head>
<body>

  <header>
    <h1></h1>
    <p></p>
  </header>

  <main>

    <section>
      <h2>Hi, I'm Nguyen Phuc</h2>
      <p>
        Hello, I'm Phuc. Currently, I'm a final-year student at UET-VNU, my major is Computer Science.
      </p>
    </section>

  </main>

  <footer>
    Goodbye!
  </footer>

</body>
</html>
